<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MMO Idle RPG</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash (dark unless chosen otherwise).
      let t = 'dark';
      try {
        const saved = localStorage.getItem('theme');
        if (saved === 'light') t = saved;
        else if (saved === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      } catch {}
      document.documentElement.dataset.theme = t;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
